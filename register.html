    <main>
        <h2>Register</h2>

        <form id="formularioRegistro">
            <div class="formulario">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Write your email..." />
            </div>
            <div class="formulario">
                <label for="contraseña">Password:</label>
                <input type="password" id="contraseña" name="contraseña" placeholder="Write"
            </div>
            <div class="formulario">
                <label for="nombre">Name:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Write your name..." />
            </div>
            <div class="formulario">
                <label for="apellido1">First surname:</label>
                <input type="text" id="apellido1" name="apellido1" placeholder="Write your first surname..." />
            </div>
            <div class="formulario">
                <label for="apellido2">Second surname:</label>
                <input type="text" id="apellido2" name="apellido2" placeholder="Write your second surname..." />
            </div>
            <br>
            <div class="formulario">
                <label for="pais">Country:</label>
                <input type="text" id="pais" name="pais" placeholder="Write your country..." />
            </div>
            <div class="formulario">
                <label for="ciudad">City:</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Write your city..." />
            </div>
            <br>
            <div class="formulario">
                <label for="telefono">Phone number:</label>
                <input type="number" id="telefono" name="telefono" placeholder="Write your phone number..." />
            </div>
            <div class="formulario">
                <label for="direccion">Address:</label>
                <input type="text" id="direccion" name="direccion" placeholder="Write your address..." />
            </div>
            <div class="formulario">
                <label>Gender: </label>
                <div class="genero">
                    <input type="radio" id="masculino" name="genero" value="masculino" />
                    <label for="masculino">Male</label>
                    <input type="radio" id="femenino" name="genero" value="femenino" />
                    <label for="femenino">Female</label>
                    <input type="radio" id="otro" name="genero" value="otro" />
                    <label for="otro">Other</label>
                </div>
            </div>
            <div class="formulario">
                <label for="fechaNacimiento">Birthdate:</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento" placeholder="Write your birthdate..." />
            </div>
            <input type="submit" id="enviar" value="Submit" />
        </form>
    </main>
