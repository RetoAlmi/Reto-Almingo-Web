    <a href="index.html"><img class="logo" src="images/logo.png" alt="Logo"></a>
    <h1>ALMINGO</h1>
    <p>Company specializing in software & app development</p>
    <nav>
      <ul class="menuNivel1">
        <li class="sinSubMenu"><a href="index.html">Home</a></li>
        <li>
          <a href="projects.html">Projects</a>
          <ul class="menuNivel2">

  <main>
    <h1>Log in</h1>

    <div id="inicioSesion">
      <p>
        <label for="usuario">Username or email:</label><br>
        <input type="text" id="usuario" name="usuario" required>
      </p>

      <p>
        <label for="contrasena">Password:</label><br>
        <input type="password" id="contrasena" name="contrasena" required>
      </p>

      <p>
        <input type="checkbox" id="recordar" name="recordar">
        <label for="recordar">Remember me</label>
      </p>

      <p>
        <button type="submit">Log in</button>
      </p>
    </div>

    <p>Don't have an account? <a href="register.html">Register</a></p>
  </main>
